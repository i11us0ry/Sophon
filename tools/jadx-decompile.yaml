name: "jadx_decompile"
command: "/opt/sophon/thirdTools/decompile.py"
args: ["--mode", "jadx"]
enabled: true
timeout_seconds: 300
requires_binaries: ["java", "/opt/sophon/thirdTools/jadx/bin/jadx", "/usr/bin/setpriv"]
short_description: "Decompile APK, DEX, or JAR files with JADX CLI"
description: |
  Run the local JADX CLI for authorized Android or Java artifacts.

  Output is restricted to the current workspace. Resource extraction is
  disabled by default to keep scans focused and bounded.
parameters:
  - name: "input_path"
    type: "string"
    description: "APK, DEX, or JAR file inside the workspace or authorized upload directory"
    required: true
    flag: "--input"
    format: "flag"
  - name: "output_dir"
    type: "string"
    description: "New output directory inside the current workspace"
    required: true
    flag: "--output"
    format: "flag"
  - name: "skip_resources"
    type: "bool"
    description: "Skip Android resource extraction"
    required: false
    default: true
    flag: "--skip-resources"
    format: "flag"
  - name: "max_input_mb"
    type: "int"
    description: "Maximum input size in MiB"
    required: false
    default: 2048
    flag: "--max-input-mb"
    format: "flag"
  - name: "max_files"
    type: "int"
    description: "Maximum generated file count"
    required: false
    default: 5000
    flag: "--max-files"
    format: "flag"
  - name: "max_output_mb"
    type: "int"
    description: "Maximum generated output size in MiB"
    required: false
    default: 2048
    flag: "--max-output-mb"
    format: "flag"
  - name: "max_runtime_seconds"
    type: "int"
    description: "Maximum runtime in seconds, capped at 285 seconds"
    required: false
    default: 240
    flag: "--max-runtime-seconds"
    format: "flag"
  - name: "max_memory_mb"
    type: "int"
    description: "Maximum JADX heap and memory budget in MiB"
    required: false
    default: 2048
    flag: "--max-memory-mb"
    format: "flag"
