name: "suo5"
command: "python3"
args: ["/opt/sophon/tools/suo5_manager.py"]
enabled: true
timeout_seconds: 75
requires_binaries:
  - "/opt/sophon/thirdTools/suo5-linux-amd64"
  - "/opt/sophon/thirdTools/suo5-linux-arm64"
short_description: "管理 suo5 HTTP 隧道（operation/target/port/method/auth/proxy）"
description: |
  suo5 是长驻 HTTP 隧道。本工具通过后台进程管理方式提供 start、status、stop，
  避免同步执行阻塞 Agent。

  start 会在会话共享工作区启动隧道，仅监听 127.0.0.1，并默认生成随机 SOCKS5
  认证信息。隧道进程、日志和认证信息保存在当前会话的 .suo5 状态目录。
  启动等待时间会根据请求 timeout 和 retry 自动延长，避免远端握手超过 3 秒时
  在本地代理端口建立前被误杀。

  operation=help 会返回完整参数说明和调用示例。operation=start 时 target 必填。
  仅用于已授权测试。不要将本地监听地址改为 0.0.0.0。
parameters:
  - name: "operation"
    type: "string"
    description: "操作类型：help 查看参数，start 启动隧道，status 查看状态，stop 停止隧道"
    required: true
    position: 0
    format: "positional"
    options: ["help", "start", "status", "stop"]
  - name: "target"
    type: "string"
    description: "start 时必填，远端 suo5 Shell URL，仅允许 http/https"
    required: false
    flag: "--target"
    format: "flag"
  - name: "port"
    type: "int"
    description: "本地 SOCKS5 端口，范围 1024-65535，默认 1111"
    required: false
    flag: "--port"
    format: "flag"
    default: 1111
  - name: "method"
    type: "string"
    description: "HTTP 方法，GET 或 POST，默认 POST"
    required: false
    flag: "--method"
    format: "flag"
    default: "POST"
  - name: "mode"
    type: "string"
    description: "传输模式：auto、full、half、classic，默认 auto"
    required: false
    flag: "--mode"
    format: "flag"
    default: "auto"
  - name: "auth"
    type: "string"
    description: "本地 SOCKS5 认证 username:password；留空自动生成"
    required: false
    flag: "--auth"
    format: "flag"
  - name: "proxy"
    type: "string"
    description: "可选上游代理，支持 http、https、socks5、socks5h"
    required: false
    flag: "--proxy"
    format: "flag"
  - name: "header_json"
    type: "string"
    description: "可选 Header 字符串，例如 'Cookie: sid=...'，或 JSON 字符串数组"
    required: false
    flag: "--header-json"
    format: "flag"
  - name: "ua"
    type: "string"
    description: "可选 User-Agent"
    required: false
    flag: "--ua"
    format: "flag"
  - name: "timeout"
    type: "int"
    description: "请求超时秒数，范围 1-300，默认 5"
    required: false
    flag: "--timeout"
    format: "flag"
    default: 5
  - name: "retry"
    type: "int"
    description: "请求重试次数，范围 0-10，默认 1"
    required: false
    flag: "--retry"
    format: "flag"
    default: 1
  - name: "debug"
    type: "bool"
    description: "启用 suo5 调试输出"
    required: false
    flag: "--debug"
    format: "flag"
    default: false
  - name: "no_gzip"
    type: "bool"
    description: "禁用压缩"
    required: false
    flag: "--no-gzip"
    format: "flag"
    default: false
  - name: "no_browser_headers"
    type: "bool"
    description: "禁用浏览器请求头"
    required: false
    flag: "--no-browser-headers"
    format: "flag"
    default: false
