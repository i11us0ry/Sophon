services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: sophon-backend:latest
    restart: unless-stopped
    init: true
    stop_grace_period: 50s
    cap_add:
      - NET_RAW
    environment:
      # 监听地址与容器内路径属于部署拓扑，继续由 Compose 提供
      SOPHON_HOST: 0.0.0.0
      SOPHON_PORT: "18080"
      SOPHON_DATA_DIR: /data
      SOPHON_SKILLS_DIR: /data/skills
      SOPHON_MCP_COMMAND: /usr/local/bin/sophon-mcp-tools
      SOPHON_CONFIG: /opt/sophon/config.yml
      # 模型、Embedding、HITL、Session 等初始配置统一放在 config.yml
      # 下面只保留密钥类覆盖项，留空时使用 config.yml 中的值
      SOPHON_ADMIN_PASSWORD: ${SOPHON_ADMIN_PASSWORD:?deploy/.env 中必须设置 SOPHON_ADMIN_PASSWORD}
      SOPHON_LLM_API_KEY: ${SOPHON_LLM_API_KEY:-}
      SOPHON_EMBEDDING_API_KEY: ${SOPHON_EMBEDDING_API_KEY:-}
    volumes:
      - sophon-data:/data
      - ../config.yml:/opt/sophon/config.yml:ro
    expose:
      - "18080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/18080"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: sophon-web:latest
    restart: unless-stopped
    init: true
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${SOPHON_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/compose.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  sophon-data:
