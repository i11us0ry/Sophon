worker_processes auto;
pid /tmp/sophon-nginx.pid;
error_log /tmp/sophon-nginx-error.log info;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $request_id [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /tmp/sophon-nginx-access.log main;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    upstream sophon_backend {
        server 127.0.0.1:18080;
        keepalive 16;
    }

    server {
        listen 8080 default_server;
        server_name _;

        root /opt/sophon/frontend/dist;
        index index.html;
        client_max_body_size 100m;

        include /opt/sophon/deploy/nginx/security-headers.conf;

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        location = /livez {
            proxy_pass http://sophon_backend/livez;
            include /opt/sophon/deploy/nginx/proxy-headers.conf;
        }

        location = /readyz {
            proxy_pass http://sophon_backend/readyz;
            include /opt/sophon/deploy/nginx/proxy-headers.conf;
        }

        location /api/terminal/ws {
            proxy_pass http://sophon_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
        }

        location ~ ^/api/(chat/stream|eino-agent/stream|multi-agent/stream|agent-loop/task-events|c2/events/stream)$ {
            proxy_pass http://sophon_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            include /opt/sophon/deploy/nginx/proxy-headers.conf;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_read_timeout 600s;
            add_header X-Accel-Buffering no always;
            include /opt/sophon/deploy/nginx/security-headers.conf;
        }

        location ~ ^/api/conversations/[^/]+/attachments$ {
            client_max_body_size 2052m;
            client_body_timeout 600s;
            proxy_pass http://sophon_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            include /opt/sophon/deploy/nginx/proxy-headers.conf;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        location /api/ {
            proxy_pass http://sophon_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            include /opt/sophon/deploy/nginx/proxy-headers.conf;
        }

        location = /mcp {
            proxy_pass http://127.0.0.1:18081;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            include /opt/sophon/deploy/nginx/proxy-headers.conf;
            proxy_read_timeout 600s;
        }

        location /assets/ {
            try_files $uri =404;
            expires 1y;
        }

        location = /index.html {
            expires -1;
            add_header Cache-Control "no-store" always;
            include /opt/sophon/deploy/nginx/security-headers.conf;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
