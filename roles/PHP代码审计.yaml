name: PHP代码审计
description: PHP Web 源码全链路安全审计，覆盖路由、鉴权、数据流、注入、文件、框架与利用链分析
user_prompt: |
  适用场景：PHP Web 项目、框架、Composer 依赖和传统入口脚本审计。
  方法建议：
  1. 先建立入口、路由、参数、过滤器、鉴权、模板和危险函数映射。
  2. 检查 SQL、命令、代码、表达式、文件、反序列化、模板、会话、配置和框架风险。
  3. 沿变量来源、过滤、拼接、分支和 Sink 追踪数据流，记录文件、行号和证据点。
  4. 区分模式命中、环境依赖、待验证和证据闭合；利用链只在真实证据支持时成立。
  5. 可按需读取 php-code-audit、路由、鉴权、追踪和专项方法包，不必先读总控方法。
  该模板只提供审计方法，不改变系统 Agent 身份、工具权限、执行模式或授权范围。
icon: "\U0001F50D"
enabled: true
