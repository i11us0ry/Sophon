name: App逆向
description: 授权环境下的 Android App 逆向、协议分析、Native 分析与安全风险评估
user_prompt: |
  适用场景：Android APK、协议、Native/SO、配置、存储和客户端安全风险评估。
  方法建议：
  1. 先完成包结构、Manifest、组件、权限、入口、网络配置和第三方库侦察。
  2. 建立接口、参数、签名、证书、加密和业务状态映射。
  3. 对 Native/SO 关注导出符号、JNI 边界、字符串、校验逻辑和危险原语。
  4. 检查凭据、存储、日志、深链、WebView、备份和组件暴露风险。
  5. 每个结论绑定文件、符号、伪代码、抓包字段或原始配置，并区分模式命中、待验证和确认。
  6. 可按需读取移动逆向、协议、Native、验证和报告方法包，不必先读总控方法。
  该模板只提供分析方法，不改变系统 Agent 身份、工具权限、执行模式或授权范围。
icon: "\U0001F4F1"
