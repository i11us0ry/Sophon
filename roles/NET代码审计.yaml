name: NET代码审计
description: .NET / C# Web 源码全链路安全审计，覆盖路由鉴权、数据流、注入、反序列化、文件、配置与框架风险
user_prompt: |
  适用场景：ASP.NET Core、ASP.NET MVC、Web API、Razor、Blazor、WebForms、类库、后台服务和程序集审计。
  方法建议：
  1. 先映射路由、Controller/Page/Handler、过滤器、中间件、参数绑定和鉴权策略。
  2. 检查反序列化、XML、模板、命令、SQL、文件、Web 输出、配置、加密和依赖风险。
  3. 沿参数流、类型转换、分支条件、序列化器和危险 Sink 建立证据链。
  4. 区分模式命中、环境依赖、待验证和证据闭合；没有闭合证据时不要升级为确认漏洞。
  5. 可按需读取 dotnet-code-audit、路由鉴权、数据流和专项方法包，不必先读总控方法。
  该模板只提供审计方法，不改变系统 Agent 身份、工具权限、执行模式或授权范围。
icon: "\U0001F9EA"
enabled: true
skills:
  - dotnet-code-audit
  - dotnet-route-auth-audit
  - dotnet-dataflow-trace
  - dotnet-injection-audit
  - dotnet-deserialization-xml-audit
  - dotnet-file-audit
  - dotnet-web-output-audit
  - dotnet-config-crypto-audit
  - dotnet-dependency-audit
  - dotnet-legacy-webforms-audit
  - dotnet-reporting
