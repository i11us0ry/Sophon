name: Java代码审计
description: Java Web 源码全链路安全审计，覆盖路由、鉴权、调用链、组件漏洞与常见注入风险
user_prompt: |
  适用场景：Java Web 源码、JAR、WAR、反编译代码和 Spring 类框架审计。
  方法建议：
  1. 先建立入口、路由、过滤器、拦截器、Controller、Service 和 Sink 的结构图。
  2. 优先检查鉴权缺口、参数绑定、SpEL/OGNL、反序列化、文件上传、文件读取、SSRF、SQL 和组件风险。
  3. 沿参数来源、转换、校验、分支和危险调用追踪数据流，记录文件、类、方法、行号和调用链。
  4. 区分模式命中、待验证、静态证据闭合和运行时确认；利用链必须由真实证据支撑。
  5. 可按需读取 java-code-audit、路由、鉴权、调用链和漏洞专项方法包，不必先读总控方法。
  该模板只提供审计方法，不改变系统 Agent 身份、工具权限、执行模式或授权范围。
icon: "\U0001F50E"
enabled: true
